<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Class Accounts Team</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: a top-down office floor (cabins, desks, pantry) where each AI employee is a person who sits, types, walks and talks; side panel for the selected employee, approvals and the live log */
:root{
  --bg:#eef1ec; --surface:#ffffff; --surface-2:#e8ece6; --fg:#17201b; --muted:#5b685f; --line:#d3dad1;
  --accent:#1f6b4a; --accent-soft:#dcebe2;
  --floor:#e3e6df; --floor-line:#d7dbd2; --wall:#9fb3c2; --cabin:#e9f0f3; --desk:#c99a68; --desk-edge:#a67a4c;
  --chair:#3d4552; --mon-frame:#2b3038; --screen-off:#48515c; --screen-on:#cfe9ff; --glow:#7cc4ff; --shadow:rgba(0,0,0,.18); --plant:#4f8a5b; --pot:#b8714b;
  --ok:#1f7a4d; --ok-bg:#ddf0e4; --work:#1d5fa8; --work-bg:#dde9f7; --warn:#a15c00; --warn-bg:#fbecd2;
  --err:#b3261e; --err-bg:#f8dedb; --idle:#66706a; --idle-bg:#e4e8e3;
  --f-display:"Familjen Grotesk","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201c; --surface-2:#1f2924; --fg:#e4ebe6; --muted:#98a69d; --line:#2c3832;
  --accent:#5cc493; --accent-soft:#1d3329;
  --floor:#1d2420; --floor-line:#242c27; --wall:#4d6576; --cabin:#1b2a31; --desk:#8a6643; --desk-edge:#6a4c30;
  --chair:#0d1013; --mon-frame:#0b0d10; --screen-off:#2b323a; --screen-on:#bfe2ff; --glow:#4aa8ff; --shadow:rgba(0,0,0,.45); --plant:#4c8a5a; --pot:#8f5638;
  --ok:#6fd39f; --ok-bg:#183327; --work:#7fb4f0; --work-bg:#172a40; --warn:#f0b35c; --warn-bg:#3a2a12;
  --err:#f08a80; --err-bg:#3d1b18; --idle:#9aa59e; --idle-bg:#252e29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201c; --surface-2:#1f2924; --fg:#e4ebe6; --muted:#98a69d; --line:#2c3832;
  --accent:#5cc493; --accent-soft:#1d3329;
  --floor:#1d2420; --floor-line:#242c27; --wall:#4d6576; --cabin:#1b2a31; --desk:#8a6643; --desk-edge:#6a4c30;
  --chair:#0d1013; --mon-frame:#0b0d10; --screen-off:#2b323a; --screen-on:#bfe2ff; --glow:#4aa8ff; --shadow:rgba(0,0,0,.45); --plant:#4c8a5a; --pot:#8f5638;
  --ok:#6fd39f; --ok-bg:#183327; --work:#7fb4f0; --work-bg:#172a40; --warn:#f0b35c; --warn-bg:#3a2a12;
  --err:#f08a80; --err-bg:#3d1b18; --idle:#9aa59e; --idle-bg:#252e29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:4px 0 0}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.live.on .dot{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
button{font:600 13.5px var(--f-body);border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.plate:focus-visible,.ch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip b{font-family:var(--f-display);font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}}
.officeBox{min-width:0;display:grid;gap:8px}
.office{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--floor)}
.sizer{position:relative}
.stage{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;
  background-image:linear-gradient(var(--floor-line) 1px,transparent 1px),linear-gradient(90deg,var(--floor-line) 1px,transparent 1px);background-size:40px 40px}
.banner{font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swipe{display:none!important}
@media (max-width:700px){.swipe{display:inline!important;font-weight:600}}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* rooms & furniture */
.room{position:absolute;border:3px solid var(--wall);background:var(--cabin);border-radius:6px}
.door{position:absolute;height:5px;background:var(--floor)}
.rlabel{position:absolute;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.desk{position:absolute;width:124px;height:44px;background:var(--desk);border-radius:6px;box-shadow:0 4px 0 var(--desk-edge)}
.desk.big{width:160px}
.chair{position:absolute;width:38px;height:34px;border-radius:12px 12px 5px 5px;background:var(--chair)}
.mon{position:absolute;width:48px;height:30px;border-radius:4px;background:var(--screen-off);border:3px solid var(--mon-frame);overflow:hidden;transition:background .3s,box-shadow .3s}
.mon::after{content:"";position:absolute;left:3px;right:3px;bottom:4px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 12%,transparent)}
.mon.on{background:var(--screen-on);box-shadow:0 0 16px var(--glow)}
.mon i{position:absolute;left:3px;bottom:4px;height:3px;border-radius:2px;background:var(--work);z-index:1;transition:width .5s}
.mon.on b{position:absolute;left:4px;top:3px;width:60%;height:2px;background:color-mix(in srgb,var(--work) 55%,transparent);box-shadow:0 5px 0 color-mix(in srgb,var(--work) 40%,transparent),0 10px 0 color-mix(in srgb,var(--work) 30%,transparent)}
.plate{position:absolute;width:160px;display:grid;justify-items:center;gap:0;cursor:pointer;border-radius:8px;padding:2px 4px}
.plate:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.plate .n{font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.15}
.plate .r{font-size:11.5px;color:var(--muted);line-height:1.2;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .s{font-family:var(--f-mono);font-size:10.5px;padding:0 7px;border-radius:99px;margin-top:2px}
.plate.sel .n{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.plant{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--plant);box-shadow:inset -5px -5px 0 rgba(0,0,0,.15)}
.plant::after{content:"";position:absolute;left:9px;top:24px;width:16px;height:14px;border-radius:0 0 5px 5px;background:var(--pot)}
.counter{position:absolute;background:var(--desk);box-shadow:0 4px 0 var(--desk-edge);border-radius:5px}
.machine{position:absolute;width:24px;height:30px;background:var(--mon-frame);border-radius:4px}
.cooler{position:absolute;width:22px;height:40px;border-radius:6px 6px 3px 3px;background:var(--screen-on);border:2px solid var(--wall)}
.table{position:absolute;border-radius:50%;background:var(--desk);box-shadow:0 4px 0 var(--desk-edge)}
.filing{position:absolute;width:30px;height:46px;background:var(--wall);border-radius:3px;box-shadow:inset 0 15px 0 rgba(0,0,0,.08),inset 0 30px 0 rgba(0,0,0,.05)}

/* people */
.ch{position:absolute;left:0;top:0;width:44px;height:72px;cursor:pointer;will-change:transform}
.ch::after{content:"";position:absolute;left:8px;bottom:-3px;width:28px;height:7px;border-radius:50%;background:var(--shadow);z-index:-1}
.ch.sit::after{display:none}
.ch .fl{width:44px;height:72px}
.ch.left .fl{transform:scaleX(-1)}
.ch svg{display:block;overflow:visible}
.leg,.arm{transform-box:fill-box;transform-origin:50% 0}
.ch.walking .leg.l{animation:legA .36s infinite alternate ease-in-out}
.ch.walking .leg.r{animation:legB .36s infinite alternate ease-in-out}
.ch.walking .arm.l{animation:legB .36s infinite alternate ease-in-out}
.ch.walking .arm.r{animation:legA .36s infinite alternate ease-in-out}
.ch.walking .body{animation:bob .18s infinite alternate}
.ch.sit.working .arm{animation:type .22s infinite alternate}
.ch.sit.working .arm.r{animation-delay:.11s}
.ch.sit:not(.working) .body{animation:breathe 3.5s infinite ease-in-out}
@keyframes legA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes legB{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes type{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(-14deg) translateY(-2px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.nm{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font:700 11.5px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:0 7px;white-space:nowrap}
.ch.sit .nm{display:none}
.badge[hidden]{display:none}
.badge{position:absolute;top:-6px;right:-8px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-mono);border:2px solid var(--surface)}
.badge.working{background:var(--work);color:var(--surface);animation:blink 1.2s infinite}
.badge.needs_approval{background:var(--warn);color:var(--surface)}
.badge.error{background:var(--err);color:var(--surface)}
.badge.done{background:var(--ok);color:var(--surface)}
@keyframes blink{50%{opacity:.55}}
.bubble{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);width:max-content;max-width:210px;background:var(--surface);color:var(--fg);border:1.5px solid var(--fg);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.3;box-shadow:0 4px 12px var(--shadow);animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1.5px solid var(--fg);border-bottom:1.5px solid var(--fg);transform:translateX(-50%) rotate(45deg)}
.bubble .to{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.bubble.r{left:6px;transform:none;animation:pop2 .25s ease-out}.bubble.r::after{left:14px}
.bubble.l{left:auto;right:6px;transform:none;animation:pop2 .25s ease-out}.bubble.l::after{left:auto;right:4px;transform:rotate(45deg)}
@keyframes pop2{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ch *{animation:none!important}.live.on .dot,.badge{animation:none}}

/* side panel */
aside{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sechead small{color:var(--muted);font-size:12.5px}
.who{display:flex;gap:12px;align-items:center}
.av{flex:none;width:48px;height:56px;display:grid;place-items:end center;background:var(--surface-2);border-radius:10px;overflow:hidden}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.s-working{color:var(--work);background:var(--work-bg)}.s-done{color:var(--ok);background:var(--ok-bg)}
.s-needs_approval{color:var(--warn);background:var(--warn-bg)}.s-error{color:var(--err);background:var(--err-bg)}
.s-idle,.s-onboarding{color:var(--idle);background:var(--idle-bg)}
.task{font-size:14px;background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.task em{font-style:normal;color:var(--muted)}
.prog{display:grid;gap:5px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.pl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
.steps li{display:flex;gap:7px;align-items:baseline}
.steps .k{font-family:var(--f-mono);font-size:11px;width:14px;flex:none;color:var(--muted)}
.steps .done{color:var(--muted);text-decoration:line-through}
.steps .now{font-weight:600;color:var(--work)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:3px}
.feed{list-style:none;margin:0;padding:0;display:grid;max-height:380px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;padding:8px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed .t{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.feed .w{font-weight:600;font-size:13.5px}
.feed .w small{font-weight:400;color:var(--muted)}
.feed .msg{grid-column:2;font-size:13.5px;overflow-wrap:anywhere}
.feed .demo{font-family:var(--f-mono);font-size:10px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;margin-left:4px}
.lv-warn .w{color:var(--warn)}.lv-error .w{color:var(--err)}.lv-success .w{color:var(--ok)}
.appr{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px;display:grid;gap:6px}
.appr p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.appr .btns{display:flex;gap:8px}
.empty{font-size:13.5px;color:var(--muted);margin:0}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:22px;height:22px;flex:none}
.credit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.credit .logo{width:20px;height:20px;flex:none}
.credit a{color:var(--accent);font-weight:600}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.langsw button{border:0;border-radius:0;padding:7px 11px;font-weight:600;color:var(--muted);background:transparent}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
:root[lang="hi"] .rlabel,:root[lang="hi"] .sub,:root[lang="hi"] .eyebrow,:root[lang="hi"] .plate .s,:root[lang="hi"] .meta,:root[lang="hi"] .pl,:root[lang="hi"] .pill,:root[lang="hi"] .live,:root[lang="hi"] .edcard legend{font-family:var(--f-body);letter-spacing:0;text-transform:none}
:root[lang="hi"] .rlabel{font-size:12px;font-weight:600}
#editor{gap:14px}
.edgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.edcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:grid;gap:8px;min-width:0}
.edcard legend{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 4px}
.fld{display:grid;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld textarea,.fld select{font:400 14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus-visible,.fld textarea:focus-visible,.fld select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.edbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
.mini .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.audit{font-size:13px;border-radius:8px;padding:7px 10px;background:var(--ok-bg);color:var(--ok)}
.audit.low{background:var(--warn-bg);color:var(--warn)}
.audit.bad{background:var(--err-bg);color:var(--err)}
.warnline{font-size:13px;border-radius:8px;padding:7px 10px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.idea{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px;display:grid;gap:5px}
.idea p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.idea .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13.5px}
.expert{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hist{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.hist .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}
.hist .row span:first-child{min-width:0;overflow-wrap:anywhere}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wcat-logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#17573c"/><rect x="13" y="41" width="9" height="11" rx="2.5" fill="#ffffff" opacity=".55"/><rect x="27.5" y="35" width="9" height="17" rx="2.5" fill="#ffffff" opacity=".8"/><rect x="42" y="28" width="9" height="24" rx="2.5" fill="#ffffff"/><path d="M12 25l9.5 8L52 11" fill="none" stroke="#f2b84b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#wcat-logo"/></svg><span><span id="coName">Your Company</span> · <span id="deptName">Accounts Department</span></span></div>
      <h1>World Class Accounts Team</h1>
      <div style="font-size:14px;color:var(--muted)" data-i18n="tagline"></div>
    </div>
    <div class="hright">
      <div class="live" id="live"><span class="dot"></span><span id="liveTxt"></span></div>
      <div class="langsw" role="group" aria-label="Language / भाषा"><button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="hi" lang="hi">हिंदी</button><button type="button" data-lang="hn" lang="en">Hinglish</button></div>
      <button id="editBtn" type="button" hidden data-i18n="editBtn"></button>
      <button class="pri" id="demoBtn" type="button" data-i18n="demoBtn"></button>
    </div>
  </header>

  <div class="chips" aria-label="Team summary">
    <span class="chip"><b id="cTotal">–</b><span data-i18n="chipEmp"></span></span>

    },fail);
    const seen=new Set();let primed=false;
    db.collection("activity").orderBy("ts","desc").limit(40).onSnapshot(s=>{
      realFeed=s.docs.map(d=>d.data());renderFeed();
      const fresh=[];
      s.docs.forEach(d=>{if(seen.has(d.id))return;seen.add(d.id);const e=d.data();
        if(primed&&Date.now()-new Date(e.ts).getTime()<120000)fresh.push(e);});
      primed=true;
      fresh.reverse().forEach(e=>{if(!chars[e.agent_id])return;
        if(e.to&&(chars[e.to]||e.to==="boss"))talk(e.agent_id,e.to,e.message,e.reply);else say(e.agent_id,e.message);});
    },fail);
    db.collection("approvals").orderBy("created_at","desc").limit(50).onSnapshot(s=>{
      allAppr=s.docs.map(d=>({id:d.id,...d.data()}));realAppr=allAppr.filter(a=>a.status==="pending");renderAppr();renderAgents();
    },fail);
    db.collection("rules").orderBy("ts","desc").limit(30).onSnapshot(s=>{rules=s.docs.map(d=>d.data());renderRules();},fail);
    db.collection("ideas").orderBy("created_at","desc").limit(30).onSnapshot(s=>{ideas=s.docs.map(d=>({id:d.id,...d.data()}));renderIdeas();},fail);
    db.collection("learnings").orderBy("ts","desc").limit(300).onSnapshot(s=>{learnings=s.docs.map(d=>d.data());renderSel();},fail);
    setInterval(()=>{if(Object.keys(real).length)renderAgents();},60000);
  })();
})();
</script>
